# Konfigurasi ground station RC Car
#
# Semua yang ada di berkas ini diterapkan di SISI DARAT. Mengubahnya cukup
# simpan berkas lalu jalankan ulang main.py -- ESP32 tidak perlu di-flash ulang.
#
# Kalibrasi mentah stir (indeks axis, nilai ujung) TIDAK ada di sini;
# itu ada di calibration.yaml yang dihasilkan calibrate.py.

# Nomor unit mobil yang dikendalikan LattePanda ini (1, 2, atau 3).
# HARUS sama dengan UNIT_ID di firmware mobil dan kamera unit tersebut.
#
# Ini SATU-SATUNYA baris yang perlu diubah di tiga LattePanda saat balapan
# dengan 3 mobil -- network.car_ip dan camera.stream_url di bawah diturunkan
# otomatis darinya (unit 1 -> .50/.60, unit 2 -> .51/.61, unit 3 -> .52/.62).
#
# Urutan prioritas alamat mobil/kamera, dari yang paling menang:
#   1. Argumen CLI --car / --cam saat menjalankan main.py
#   2. network.car_ip / camera.stream_url kalau DITULIS EKSPLISIT di bawah
#      (baris itu sengaja dikomentari di berkas bawaan ini supaya unit:
#      yang menentukan -- buka komentarnya hanya kalau butuh alamat khusus
#      di luar skema unit 1/2/3)
#   3. Diturunkan dari unit: di atas
unit: 1

network:
  # IP statis mobil, diturunkan dari `unit:` di atas kalau baris ini
  # dikomentari. Buka komentar dan isi manual HANYA kalau mobil ini memakai
  # alamat di luar skema unit 1/2/3 baku. Router GL.iNet memakai subnet
  # 192.168.8.x dengan gateway .1 dan DHCP otomatis di rentang .100-.249.
  # car_ip: 192.168.8.50
  car_port: 4210

  # Dipakai hanya sebagai cadangan selama mobil belum membalas, kalau-kalau
  # subnet ternyata berbeda dari dugaan. Setelah mobil membalas sekali,
  # aplikasi mengunci ke alamat unicast-nya. AMAN dipertahankan sebagai
  # broadcast walau ada 3 mobil di jaringan yang sama: protokol v3 membawa
  # unit_id di setiap paket, jadi mobil lain membuang paket broadcast yang
  # bukan untuknya, dan ground station ini membuang balasan dari mobil lain
  # sebelum sempat mengunci ke alamatnya. Lihat docs/protocol.md bagian 7.
  broadcast: 192.168.8.255

  control_rate_hz: 50      # laju kirim perintah; 50 Hz = tiap 20 ms
  link_timeout_ms: 500     # telemetri hilang selama ini -> tautan dianggap putus

  # Otomatis disarm saat telemetri putus. DIMATIKAN, sepasang dengan
  # FAILSAFE_ENABLED 0 di firmware -- kalau cuma salah satu yang dimatikan,
  # sisi yang lain tetap akan menghentikan mobil dan Anda akan bingung kenapa.
  #
  # Dengan false: banner FAILSAFE masih muncul sebagai INFORMASI kalau
  # telemetri hilang, tapi mobil tidak di-disarm dan tetap menerima perintah.
  disarm_on_link_loss: false

camera:
  # URL stream kamera, diturunkan dari `unit:` di atas kalau baris ini
  # dikomentari. Sama seperti car_ip: buka komentar hanya untuk alamat
  # di luar skema baku. Harus sama dengan CAM_IP di firmware/rc_cam_esp32.
  # stream_url: http://192.168.8.60/stream
  timeout_s: 3.0

steering:
  deadzone: 0.03      # abaikan getaran kecil di sekitar tengah (0..1)
  trim: 0.0000        # geser titik tengah kalau mobil menarik ke satu sisi
  expo: 0.30          # 0 = linear; makin besar makin halus di sekitar tengah
  max_angle: 1.0      # batasi sudut belok maksimum (0..1)
  invert: false       # true kalau arah belok terbalik dari arah stir

throttle:
  deadzone: 0.05

  # expo 0 = linear. Diturunkan dari 0.40 karena pita duty yang benar-benar
  # menggerakkan mobil tinggal sempit (900-1023 dari 1023). Expo memampatkan
  # bagian bawah pedal, dan di pita sesempit ini itu berarti membuang resolusi
  # yang justru paling dibutuhkan. Naikkan lagi kalau nanti Vs dinaikkan atau
  # driver diganti ke TB6612FNG, sehingga pitanya kembali lebar.
  expo: 0.0

  # BATAS KECEPATAN, dibuka penuh (0-1).
  #
  # Membatasi di sini sudah tidak ada gunanya: yang membatasi kecepatan
  # sekarang adalah hardware, bukan angka ini. Vs L298N hanya 5 V untuk motor
  # 5-6 V, jadi setelah drop L298N ~2,5 V motor cuma menerima ~2,5 V pada duty
  # penuh. Menahan di 0.30 justru membuat motor tidak mau berputar sama sekali.
  max_forward: 1.00
  max_reverse: 1.00

  # Batas perubahan gas per detik. 3.0 berarti dari diam ke gas penuh butuh
  # sekitar 0,33 detik. Mencegah sentakan arus yang menjatuhkan tegangan
  # pada paket 4S 850 mAh -- jangan dinaikkan terlalu tinggi.
  slew_rate: 3.0

shifter:
  enabled: true
  # Batas kecepatan tiap gigi maju, sebagai kelipatan throttle.max_forward.
  # Gigi rendah memberi seluruh jangkauan pedal untuk rentang kecepatan
  # sempit -- itulah yang membuat manuver rapat jadi mungkin dengan L298N.
  gear_ratios: [0.35, 0.55, 0.75, 0.90, 1.00, 1.00]
  require_neutral_to_arm: true

brake:
  deadzone: 0.05
  strength: 1.0       # 0..1, skala kekuatan rem maksimum

display:
  width: 960
  height: 720
  vsync: false

sfx:
  enabled: true            # matikan semua suara tanpa uninstall/hapus file
  gas_pack: 0               # indeks pack gas aktif, 0 = "Sports car accelerating (medium)"
  horn_pack: 3              # 3 = "Truck horn"
  arm_pack: 2               # 0 = "Car engine start"
