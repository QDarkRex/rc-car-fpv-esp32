# Manifes berkas SFX -- dibuat otomatis saat pengunduhan awal, jangan diedit
# manual kecuali menambah/mengganti berkas suara.
#
# DUA sumber dipakai di berkas ini, lisensinya BEDA -- perhatikan per
# kategori:
#
# - horn/ dan arm/: Mixkit (mixkit.co), lisensi Mixkit Free License --
#   bebas dipakai personal maupun komersial, TIDAK wajib atribusi, tidak
#   boleh dijual ulang berkas suaranya sendiri sebagai produk berdiri
#   sendiri (menempel di aplikasi ini seperti sekarang jelas diizinkan).
#   https://mixkit.co/license/#sfxFree
#
# - gas/: Freesound.org, campuran CC0 (bebas mutlak, tidak wajib atribusi)
#   dan CC BY 4.0 (WAJIB atribusi -- nama pembuat dicantumkan per berkas
#   lewat kolom `author`/`license` di bawah). Kredit lengkap juga
#   didaftarkan di README.md bagian SFX. Berkas yang diunduh adalah preview
#   terkompresi (mp3 ~128kbps) yang disediakan Freesound sendiri untuk
#   pemutaran publik, BUKAN dipotong/dipendekkan -- panjangnya sama dengan
#   rekaman aslinya.
#
# Kolom durasi diukur langsung lewat pygame.mixer.Sound(...).get_length(),
# bukan dari halaman sumber -- jadi dijamin akurat.

